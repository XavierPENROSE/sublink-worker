name: Fix Sublink Path

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix formLogic.js
        run: |
          FILE="src/components/formLogic.js"

          echo "正在修改 $FILE ..."

          # 1. getSubconverterUrl
          sed -i "s/const origin = window.location.origin;/const origin = window.location.origin;\\n                const basePath = window.location.pathname.startsWith('\\/sublink-worker') ? '\\/sublink-worker' : '';/1" "$FILE"

          sed -i "s@return origin + '/subconverter'@return origin + basePath + '/subconverter'@" "$FILE"

          # 2. /config
          sed -i "s@fetch('/config', {@fetch((window.location.pathname.startsWith('/sublink-worker') ? '/sublink-worker' : '') + '/config', {@1" "$FILE"

          # 3. 生成 Xray / Sing-box / Clash / Surge 链接
          sed -i "s@xray: origin + '/xray?'@xray: origin + (window.location.pathname.startsWith('/sublink-worker') ? '/sublink-worker' : '') + '/xray?'@" "$FILE"

          sed -i "s@singbox: origin + '/singbox?'@singbox: origin + (window.location.pathname.startsWith('/sublink-worker') ? '/sublink-worker' : '') + '/singbox?'@" "$FILE"

          sed -i "s@clash: origin + '/clash?'@clash: origin + (window.location.pathname.startsWith('/sublink-worker') ? '/sublink-worker' : '') + '/clash?'@" "$FILE"

          sed -i "s@surge: origin + '/surge?'@surge: origin + (window.location.pathname.startsWith('/sublink-worker') ? '/sublink-worker' : '') + '/surge?'@" "$FILE"

          # 4. shorten-v2
          sed -i "s@\${origin}/shorten-v2@\${origin}\$(window.location.pathname.startsWith('/sublink-worker') ? '/sublink-worker' : '')/shorten-v2@" "$FILE"

          # 5. 短链接
          sed -i "s@\${origin}/\${prefixMap\[type\]}/\${returnedCode}@\${origin}\$(window.location.pathname.startsWith('/sublink-worker') ? '/sublink-worker' : '')/\${prefixMap[type]}/\${returnedCode}@" "$FILE"

          # 6. /resolve
          sed -i "s@fetch(\`/resolve?url=\${encodeURIComponent(text)}\`)@fetch(\`\${window.location.pathname.startsWith('/sublink-worker') ? '/sublink-worker' : ''}/resolve?url=\${encodeURIComponent(text)}\`)@" "$FILE"

          echo ""
          echo "=============================="
          echo "修改完成，检查结果："
          echo "=============================="

          grep -A 6 "this.generatedLinks =" "$FILE"

          echo ""
          echo "检查 /sublink-worker："

          grep -n "sublink-worker" "$FILE"

          echo ""
          echo "=============================="
          echo "Git diff："
          echo "=============================="

          git diff -- "$FILE"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/components/formLogic.js

          if git diff --cached --quiet; then
            echo "没有检测到修改。"
            exit 0
          fi

          git commit -m "Fix sublink worker custom path"
          git push
